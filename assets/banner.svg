<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#006a4e"/>
      <stop offset="100%" style="stop-color:#00b894"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="50%" style="stop-color:#55efc4"/>
      <stop offset="100%" style="stop-color:#00b894"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#00b894" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="400"/><line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="400"/><line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/><line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/><line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/><line x1="440" y1="0" x2="440" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="520" y1="0" x2="520" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/><line x1="680" y1="0" x2="680" y2="400"/>
    <line x1="720" y1="0" x2="720" y2="400"/><line x1="760" y1="0" x2="760" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/><line x1="840" y1="0" x2="840" y2="400"/>
    <line x1="880" y1="0" x2="880" y2="400"/><line x1="920" y1="0" x2="920" y2="400"/>
    <line x1="960" y1="0" x2="960" y2="400"/><line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1040" y1="0" x2="1040" y2="400"/><line x1="1080" y1="0" x2="1080" y2="400"/>
    <line x1="1120" y1="0" x2="1120" y2="400"/><line x1="1160" y1="0" x2="1160" y2="400"/>
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
  </g>

  <!-- Animated floating circles -->
  <circle cx="100" cy="80" r="4" fill="#006a4e" opacity="0.3">
    <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="120" r="3" fill="#00b894" opacity="0.4">
    <animate attributeName="cy" values="120;90;120" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="320" r="5" fill="#55efc4" opacity="0.2">
    <animate attributeName="cy" values="320;290;320" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="300" r="3" fill="#006a4e" opacity="0.3">
    <animate attributeName="cy" values="300;270;300" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="50" r="2" fill="#00b894" opacity="0.5">
    <animate attributeName="cy" values="50;30;50" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="350" r="4" fill="#55efc4" opacity="0.2">
    <animate attributeName="cy" values="350;325;350" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Scale icon (law symbol) -->
  <g transform="translate(520, 100)" filter="url(#glow)">
    <!-- Balance beam -->
    <line x1="80" y1="20" x2="80" y2="60" stroke="#00b894" stroke-width="3"/>
    <line x1="30" y1="60" x2="130" y2="60" stroke="#00b894" stroke-width="2.5"/>
    <!-- Left pan -->
    <line x1="30" y1="60" x2="15" y2="95" stroke="#00b894" stroke-width="1.5"/>
    <line x1="30" y1="60" x2="45" y2="95" stroke="#00b894" stroke-width="1.5"/>
    <path d="M10,95 Q30,115 50,95" fill="none" stroke="#00b894" stroke-width="2"/>
    <!-- Right pan -->
    <line x1="130" y1="60" x2="115" y2="95" stroke="#00b894" stroke-width="1.5"/>
    <line x1="130" y1="60" x2="145" y2="95" stroke="#00b894" stroke-width="1.5"/>
    <path d="M110,95 Q130,115 150,95" fill="none" stroke="#00b894" stroke-width="2"/>
    <!-- Base -->
    <rect x="65" y="15" width="30" height="8" rx="4" fill="#00b894"/>
    <!-- AI sparkle on top -->
    <circle cx="80" cy="10" r="3" fill="#55efc4" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <text x="600" y="250" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="700" fill="url(#textGlow)" filter="url(#softGlow)">
    BanglaLaw AI
  </text>

  <!-- Subtitle -->
  <text x="600" y="290" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#8b949e" letter-spacing="3">
    AI-Powered Bangladeshi Legal Information Assistant
  </text>

  <!-- Bangla subtitle -->
  <text x="600" y="325" text-anchor="middle" font-family="'Noto Sans Bengali', Arial, sans-serif" font-size="18" fill="#006a4e" opacity="0.8">
    বাংলাদেশের আইন সহজ ভাষায়
  </text>

  <!-- Bottom accent line -->
  <rect x="450" y="350" width="300" height="2" rx="1" fill="url(#accent)" opacity="0.6">
    <animate attributeName="width" values="200;300;200" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="500;450;500" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Tech badges area -->
  <g transform="translate(390, 370)" font-family="monospace" font-size="11" fill="#8b949e" opacity="0.5">
    <text x="0" y="0">RAG</text>
    <text x="40" y="0">|</text>
    <text x="55" y="0">ChromaDB</text>
    <text x="130" y="0">|</text>
    <text x="145" y="0">Groq LLM</text>
    <text x="220" y="0">|</text>
    <text x="235" y="0">FastAPI</text>
    <text x="300" y="0">|</text>
    <text x="315" y="0">Streamlit</text>
  </g>
</svg>
